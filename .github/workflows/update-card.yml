name: Update profile cards

on:
  schedule:
    # Every 30 min, off the top-of-hour contention window GitHub warns about.
    # A local systemd timer (profile-card.timer) is the primary trigger; this
    # cron is a best-effort fallback since GitHub drops scheduled events.
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-card
  cancel-in-progress: false

jobs:
  update-card:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Checkout public Zeitgeist assets
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: revoydotdev/zeitgeist
          path: .zeitgeist

      - name: Cache playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1

      - name: Cache venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: ${{ runner.os }}-card-venv-playwright-pillow-websockets-v1

      - name: Setup venv
        run: |
          if [ ! -d .venv ]; then
            python3 -m venv .venv
            .venv/bin/pip install -q playwright==1.62.0 Pillow==12.3.0 websockets==17.1
          fi
          .venv/bin/python3 -m playwright install chromium

      - name: Generate SVG card
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          ZEITGEIST_DIR: ${{ github.workspace }}/.zeitgeist
        run: .venv/bin/python3 scripts/generate_cards.py

      - name: Render APNG from SVG
        run: .venv/bin/python3 scripts/render_apng.py

      - name: Publish card to assets branch + bust README cache
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f card.png ] || { echo "card.png not generated"; exit 1; }
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          # Skip if the published card is byte-identical to the new one.
          if git fetch -q "$remote" assets 2>/dev/null \
             && git show FETCH_HEAD:card.png > "$tmp/prev.png" 2>/dev/null \
             && cmp -s "$tmp/prev.png" card.png; then
            echo "card unchanged; nothing to publish"; exit 0
          fi
          ts=$(date -u +%s)
          # 1) Publish binaries to a single-commit orphan 'assets' branch.
          #    Force-push keeps it one commit deep, so history never grows.
          cp card.png card.svg "$tmp/"
          git -C "$tmp" init -q
          git -C "$tmp" checkout -q --orphan assets
          git -C "$tmp" add card.png card.svg
          git -C "$tmp" -c user.name="github-actions[bot]" \
                        -c user.email="github-actions[bot]@users.noreply.github.com" \
                        commit -qm "card assets ${ts}"
          git -C "$tmp" push -q --force "$remote" assets
          # 2) Bust the camo image-proxy cache by versioning the README URL
          #    (text-only commit on main; the binary lives on the assets branch).
          sed -i -E "s|(raw\\.githubusercontent\\.com/${GITHUB_REPOSITORY}/assets/card\\.png\\?v=)[0-9]+|\\1${ts}|" README.md
          if git diff --quiet README.md; then exit 0; fi
          git add README.md
          git commit -m "chore: refresh profile card"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push attempt $attempt failed; rebasing..."
            git pull --rebase --autostash origin main || git rebase --abort || true
          done
          echo "push failed after 3 attempts" >&2; exit 1

  update-hero:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Checkout public Zeitgeist assets
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: revoydotdev/zeitgeist
          path: .zeitgeist

      - name: Cache venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv-hero
          key: ${{ runner.os }}-hero-venv-websockets-v1

      - name: Setup venv
        run: |
          if [ ! -d .venv-hero ]; then
            python3 -m venv .venv-hero
            .venv-hero/bin/pip install -q websockets==17.1
          fi

      - name: Generate hero SVG
        env:
          ZEITGEIST_DIR: ${{ github.workspace }}/.zeitgeist
        run: .venv-hero/bin/python3 scripts/generate_hero.py

      - name: Commit SVG if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet hero.svg || {
            git add hero.svg
            git commit -m "Update hero SVG"
            git pull --rebase origin main
            git push
          }
